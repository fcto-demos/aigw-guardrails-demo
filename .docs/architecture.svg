<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#424242"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1150" height="860" fill="#ffffff"/>
  <text x="575" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#212121">WSO2 AI Platform — Demo Architecture</text>

  <!-- Browser -->
  <rect x="60" y="100" width="150" height="60" rx="8" fill="#eeeeee" stroke="#424242" stroke-width="1.5"/>
  <text x="135" y="135" text-anchor="middle" font-size="15" fill="#212121">Browser</text>

  <!-- ai-chatbot -->
  <rect x="300" y="90" width="220" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="410" y="123" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">ai-chatbot</text>
  <text x="410" y="144" text-anchor="middle" font-size="12.5" fill="#1565c0">demo UI — :8600</text>

  <path d="M210,130 L300,130" stroke="#424242" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ai-workspace group -->
  <rect x="60" y="230" width="210" height="190" rx="10" fill="#f8f1fb" stroke="#6a1b9a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="75" y="250" font-size="12.5" font-weight="bold" fill="#6a1b9a">ai-workspace — control plane</text>
  <rect x="80" y="262" width="170" height="40" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.2"/>
  <text x="165" y="287" text-anchor="middle" font-size="13" fill="#4a148c">platform-api</text>
  <rect x="80" y="312" width="170" height="40" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.2"/>
  <text x="165" y="337" text-anchor="middle" font-size="13" fill="#4a148c">ai-workspace UI</text>
  <rect x="80" y="362" width="170" height="40" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.2"/>
  <text x="165" y="387" text-anchor="middle" font-size="13" fill="#4a148c">api-portal</text>

  <!-- ai-gateway group -->
  <rect x="300" y="230" width="560" height="180" rx="10" fill="#fff8ef" stroke="#ef6c00" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="315" y="250" font-size="12.5" font-weight="bold" fill="#ef6c00">ai-gateway — data plane</text>

  <rect x="330" y="270" width="190" height="60" rx="8" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="425" y="305" text-anchor="middle" font-size="13.5" fill="#e65100">gateway-controller</text>

  <rect x="600" y="270" width="230" height="60" rx="8" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="715" y="297" text-anchor="middle" font-size="13.5" fill="#e65100">gateway-runtime</text>
  <text x="715" y="314" text-anchor="middle" font-size="11.5" fill="#e65100">Envoy + policy engine</text>

  <path d="M520,300 L600,300" stroke="#424242" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="560" y="293" text-anchor="middle" font-size="10.5" fill="#424242">xDS config</text>

  <!-- Redis: semantic-cache vector store, same gateway-network -->
  <rect x="745" y="350" width="100" height="46" rx="8" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="795" y="369" text-anchor="middle" font-size="12" fill="#e65100">Redis</text>
  <text x="795" y="384" text-anchor="middle" font-size="10" fill="#e65100">semantic cache</text>
  <path d="M795,330 L795,350" stroke="#424242" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>

  <!-- workspace -> controller (dashed), routed above both boxes to leave room for the label -->
  <path d="M165,230 L165,198 L430,198 L430,270" stroke="#6a1b9a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="200" y="191" font-size="10.5" fill="#6a1b9a">registers / configures</text>

  <!-- chatbot -> runtime -->
  <path d="M410,170 L410,210 L715,210 L715,270" stroke="#1565c0" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="560" y="203" text-anchor="middle" font-size="11" fill="#1565c0">/api/chat</text>

  <!-- Providers -->
  <rect x="920" y="235" width="170" height="48" rx="24" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1005" y="264" text-anchor="middle" font-size="13.5" fill="#1b5e20">Anthropic</text>

  <rect x="920" y="301" width="170" height="48" rx="24" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1005" y="330" text-anchor="middle" font-size="13.5" fill="#1b5e20">Mistral</text>

  <rect x="920" y="367" width="170" height="48" rx="24" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1005" y="396" text-anchor="middle" font-size="13.5" fill="#1b5e20">Gemini</text>

  <path d="M830,295 L910,259" stroke="#424242" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M830,300 L915,325" stroke="#424242" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M830,305 L910,391" stroke="#424242" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- runtime -> observability (dashed) -->
  <path d="M715,330 L715,470" stroke="#ef6c00" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="724" y="455" font-size="11" fill="#ef6c00">publishes analytics</text>

  <!-- Observability outer -->
  <rect x="60" y="470" width="1030" height="340" rx="10" fill="#fafafa" stroke="#616161" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="75" y="492" font-size="13.5" font-weight="bold" fill="#424242">Observability — ANALYTICS_MODE picks exactly one</text>

  <!-- moesif panel -->
  <rect x="90" y="510" width="230" height="270" rx="8" fill="#fdf1f5" stroke="#ad1457" stroke-width="1.3"/>
  <text x="105" y="532" font-size="12.5" font-weight="bold" fill="#ad1457">moesif</text>
  <rect x="115" y="610" width="180" height="70" rx="8" fill="#fce4ec" stroke="#ad1457" stroke-width="1.5"/>
  <text x="205" y="640" text-anchor="middle" font-size="13.5" fill="#880e4f">Moesif</text>
  <text x="205" y="658" text-anchor="middle" font-size="11" fill="#ad1457">WSO2 Analytics Managed Service</text>

  <!-- local panel -->
  <rect x="340" y="510" width="730" height="270" rx="8" fill="#eefaf9" stroke="#00695c" stroke-width="1.3"/>
  <text x="355" y="532" font-size="12.5" font-weight="bold" fill="#00695c">local</text>

  <!-- tracing -->
  <rect x="360" y="548" width="220" height="210" rx="8" fill="#e0f2f1" stroke="#00695c" stroke-width="1.2"/>
  <text x="375" y="568" font-size="11.5" font-weight="bold" fill="#00695c">tracing profile</text>
  <rect x="380" y="585" width="180" height="42" rx="6" fill="#ffffff" stroke="#00695c" stroke-width="1.1"/>
  <text x="470" y="611" text-anchor="middle" font-size="12.5" fill="#004d40">otel-collector</text>
  <rect x="380" y="660" width="180" height="42" rx="6" fill="#ffffff" stroke="#00695c" stroke-width="1.1"/>
  <text x="470" y="686" text-anchor="middle" font-size="12.5" fill="#004d40">Jaeger</text>
  <path d="M470,627 L470,660" stroke="#424242" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>

  <!-- logging -->
  <rect x="600" y="548" width="240" height="210" rx="8" fill="#e0f2f1" stroke="#00695c" stroke-width="1.2"/>
  <text x="615" y="568" font-size="11.5" font-weight="bold" fill="#00695c">logging profile</text>
  <rect x="620" y="582" width="200" height="38" rx="6" fill="#ffffff" stroke="#00695c" stroke-width="1.1"/>
  <text x="720" y="606" text-anchor="middle" font-size="12.5" fill="#004d40">Fluent Bit</text>
  <rect x="620" y="635" width="200" height="38" rx="6" fill="#ffffff" stroke="#00695c" stroke-width="1.1"/>
  <text x="720" y="659" text-anchor="middle" font-size="12.5" fill="#004d40">OpenSearch</text>
  <rect x="620" y="688" width="200" height="38" rx="6" fill="#ffffff" stroke="#00695c" stroke-width="1.1"/>
  <text x="720" y="712" text-anchor="middle" font-size="12.5" fill="#004d40">OpenSearch Dashboards</text>
  <path d="M720,620 L720,635" stroke="#424242" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <path d="M720,673 L720,688" stroke="#424242" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>

  <!-- metrics -->
  <rect x="860" y="548" width="190" height="210" rx="8" fill="#e0f2f1" stroke="#00695c" stroke-width="1.2"/>
  <text x="875" y="568" font-size="11.5" font-weight="bold" fill="#00695c">metrics profile</text>
  <rect x="875" y="600" width="160" height="42" rx="6" fill="#ffffff" stroke="#00695c" stroke-width="1.1"/>
  <text x="955" y="626" text-anchor="middle" font-size="12.5" fill="#004d40">Prometheus</text>
  <rect x="875" y="675" width="160" height="42" rx="6" fill="#ffffff" stroke="#00695c" stroke-width="1.1"/>
  <text x="955" y="701" text-anchor="middle" font-size="12.5" fill="#004d40">Grafana</text>
  <path d="M955,642 L955,675" stroke="#424242" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
</svg>
