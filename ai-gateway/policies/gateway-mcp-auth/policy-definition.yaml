name: gateway-mcp-auth
version: v0.3.0
displayName: Gateway MCP Auth
description: |
  Fork of mcp-auth for MCP passthrough deployments: validates the gateway bearer token
  via the underlying JWT authentication runtime, and additionally supports serving the
  upstream MCP server's live Protected Resource Metadata (fetched and cached, with only
  the resource field rewritten to the gateway) and rewriting the resource_metadata
  pointer in upstream 401 WWW-Authenticate challenges to point at the gateway.
  The gateway's own authentication failure is signalled with a distinct, realm-scoped
  challenge (no resource_metadata pointer) so clients are not sent to the MCP server's
  authorization server for a gateway-credential problem (gatewayChallengeMode).
  v0.3.0 adds `audiences` (aud enforcement) and `scopes` (allOf/anyOf scope
  enforcement), both delegated to the JWT runtime, and `prmScopesSupported` (PRM
  scope advertisement decoupled from the advertise-only requiredScopes) for
  deployments where the gateway is itself the OAuth resource — e.g. Entra-registered
  gateways doing On-Behalf-Of exchange behind this policy.

parameters:
  type: object
  additionalProperties: false
  properties:
    prmUpstreamUrl:
      type: string
      format: uri
      x-wso2-policy-advanced-param: false
      description: >-
        The upstream MCP server's own Protected Resource Metadata URL. When set, the
        well-known endpoint serves this document (fetched and cached) with only the
        `resource` field rewritten to the gateway's URL. When empty (the default), the
        legacy behaviour applies: the PRM is generated locally from the configured key
        managers.
      default: ""

    prmCacheSeconds:
      type: integer
      x-wso2-policy-advanced-param: true
      description: >-
        TTL in seconds for the fetched Protected Resource Metadata document; also
        emitted as `Cache-Control: max-age` on the well-known response.
      default: 300

    prmFetchTimeoutSeconds:
      type: integer
      x-wso2-policy-advanced-param: true
      description: HTTP client timeout in seconds for fetching the upstream PRM document.
      default: 5

    rewriteChallenge:
      type: boolean
      x-wso2-policy-advanced-param: true
      description: >-
        If true (the default), the `resource_metadata` parameter of an upstream 401
        `WWW-Authenticate` challenge is rewritten to point at the gateway's well-known
        Protected Resource Metadata endpoint. All other challenge parameters are
        preserved unchanged.
      default: true

    gatewayChallengeMode:
      type: string
      enum: [gateway, legacy, none]
      x-wso2-policy-advanced-param: true
      description: >-
        How the gateway's OWN authentication failure (missing or invalid gateway token)
        is signalled in `WWW-Authenticate`. `gateway` (default): a realm-scoped Bearer
        challenge with no `resource_metadata` pointer; `error="invalid_token"` only when a
        token was present and rejected, and an `error_description` naming the header the
        gateway expects (`system.headerName`). The JSON body message says the same. `legacy`:
        the shipped mcp-auth behaviour (pointer to the gateway's protected resource
        metadata plus `error="invalid_token"`), which with `prmUpstreamUrl` set sends
        clients to the upstream MCP server's authorization server for a gateway-credential
        problem. `none`: omit `WWW-Authenticate` entirely. Upstream 401 challenges are
        unaffected (see `rewriteChallenge`).
      default: gateway

    gatewayChallengeRealm:
      type: string
      x-wso2-policy-advanced-param: true
      description: >-
        The `realm` value used in the gateway's own challenge when `gatewayChallengeMode`
        is `gateway`. Lets clients and operators tell a gateway challenge apart from the
        upstream MCP server's.
      default: wso2-ai-gateway

    suppressGatewayChallenge:
      type: boolean
      x-wso2-policy-advanced-param: true
      x-wso2-policy-deprecated-param: true
      description: >-
        Deprecated — use `gatewayChallengeMode: none`. If true, the gateway's own
        authentication-failure responses omit the `WWW-Authenticate` header (overrides
        `gatewayChallengeMode`). Defaults to false.
      default: false

    tools:
      type: object
      x-wso2-policy-advanced-param: false
      description: Security configuration for MCP tools.
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Whether security is enabled for tools.
          default: true
        exceptions:
          type: array
          x-wso2-policy-advanced-param: true
          description: List of tool names to exclude from security checks.
          default: []
          items:
            type: string

    resources:
      type: object
      x-wso2-policy-advanced-param: false
      description: Security configuration for MCP resources.
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Whether security is enabled for resources.
          default: true
        exceptions:
          type: array
          x-wso2-policy-advanced-param: true
          description: List of resource URIs to exclude from security checks.
          default: []
          items:
            type: string

    prompts:
      type: object
      x-wso2-policy-advanced-param: false
      description: Security configuration for MCP prompts.
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Whether security is enabled for prompts.
          default: true
        exceptions:
          type: array
          x-wso2-policy-advanced-param: true
          description: List of prompt names to exclude from security checks.
          default: []
          items:
            type: string

    methods:
      type: object
      x-wso2-policy-advanced-param: false
      description: Security configuration for MCP (JSON-RPC) methods.
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Whether security is enabled for methods.
          default: true
        exceptions:
          type: array
          x-wso2-policy-advanced-param: true
          description: List of method names to exclude from security checks.
          default: []
          items:
            type: string

    issuers:
      type: array
      x-wso2-policy-advanced-param: true
      description: Specify issuer names from `system.keyManagers` to publish in protected resource metadata and use for token validation; if empty, runtime uses all configured key managers.
      default: []
      items:
        type: string

    audiences:
      type: array
      x-wso2-policy-advanced-param: false
      description: Specifies accepted audience values. Token validation succeeds only when at least one configured audience is present.
      default: []
      items:
        type: string

    scopes:
      type: object
      x-wso2-policy-advanced-param: false
      additionalProperties: false
      description: >-
        Scope requirements ENFORCED against the token's `scp`/`scope` claims (delegated to the
        JWT runtime): `allOf` requires every listed scope, `anyOf` at least one; both given are
        AND-ed. This is the enforcing counterpart of `requiredScopes`, which is advertise-only
        (published in the protected resource metadata, never checked).
      default: {}
      properties:
        allOf:
          type: array
          description: All listed scopes must be present in the token.
          items:
            type: string
        anyOf:
          type: array
          description: At least one of the listed scopes must be present in the token.
          items:
            type: string

    prmScopesSupported:
      type: array
      x-wso2-policy-advanced-param: false
      description: >-
        Scopes advertised in the generated (legacy) protected resource metadata's
        `scopes_supported`, overriding `requiredScopes` when non-empty. Lets the PRM
        advertise the full resource-URI-qualified scope form a client must request
        (e.g. `https://gw.example/ctx/mcp/mcp.access`) while token claims carry the
        short name. Ignored when `prmUpstreamUrl` serves an upstream document.
      default: []
      items:
        type: string

    requiredScopes:
      type: array
      x-wso2-policy-advanced-param: true
      description: >-
        List of scopes that should be included in the token generated through MCP auth flow.
        This will be used only to inform the MCP client about the scopes to be included in the token through the protected resource metadata endpoint, 
        and the runtime will not enforce scope checks based on this list. 
        To enforce scopes for specific tools, resources, prompts, or methods, use the `MCP Authorization` policy.
      default: []
      items:
        type: string

    claimMappings:
      type: object
      x-wso2-policy-advanced-param: true
      description: Map claimName -> downstream header or context key to expose for downstream services.
      default: {}
      additionalProperties:
        type: string

    userIdClaim:
      type: string
      x-wso2-policy-advanced-param: true
      description: >-
        Specifies the claim name used to extract the user ID for analytics.
        Defaults to "sub" when omitted.
      default: sub

    forwardToken:
      type: boolean
      x-wso2-policy-advanced-param: true
      description: >-
        If true, the validated token is forwarded to the upstream service under
        `forwardedTokenHeader`. If false (the default), the token is not
        forwarded at all and the MCP server never sees the client credential.
        In both cases the inbound token header (`system.headerName`) is removed
        before the request is proxied, unless another policy has already set that
        header to a different value — see `forwardedTokenHeader`.
      default: false

    forwardedTokenHeader:
      type: string
      x-wso2-policy-advanced-param: true
      minLength: 1
      pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
      description: >-
        The header name used to forward the token to the upstream service when
        `forwardToken` is true. If this differs from `system.headerName`, the
        inbound header is removed and the token is forwarded under this name
        instead. By default the full header value (including the scheme prefix)
        is forwarded; set `forwardTokenStripScheme` to true to forward only the
        bare token value. Has no effect when `forwardToken` is false.
        The inbound header is preserved, rather than removed, when a peer policy
        such as `set-headers` has set it to a value other than the one the client
        sent — that policy is then treated as the owner of the header. Pointing
        this at `system.headerName` therefore means the token is not forwarded at
        all whenever a peer owns that header, since it is the only header the
        token could travel in; a warning is logged when that happens.
      default: x-forwarded-authorization

    forwardTokenStripScheme:
      type: boolean
      x-wso2-policy-advanced-param: true
      description: >-
        Controls what is forwarded under `forwardedTokenHeader` when
        `forwardToken` is true. If true, only the bare token value (with the
        scheme prefix such as "Bearer" stripped) is forwarded. If false (the
        default), the full header value including the prefix is forwarded. Has no
        effect when `forwardToken` is false.
      default: false

systemParameters:          
  type: object
  additionalProperties: false
  properties:
    keyManagers:
      type: array
      description: >-
        List of key manager definitions. Each entry must include a unique `name` 
        and either `jwks` (for remote JWKS or local certificates) configuration.
      items:
        type: object
        additionalProperties: false
        required: ["name", "issuer"]
        properties:
          name:
            type: string
            description: Unique name for this key manager/provider (used in `user.issuers`).
          issuer:
            type: string
            description: Issuer (iss) value associated with keys from this provider.
          scopeClaim:
            type: string
            description: >-
              Optional token claim from which scopes are read for tokens verified by this key
              manager. When omitted, scopes are read from both the space-delimited `scope` string
              claim and the `scp` array claim (the default behavior). Set to `scp` for Entra,
              whose `scp` claim is a space-delimited string.
          scopeClaimSeparator:
            type: string
            description: >-
              Separator used to split a string-valued `scopeClaim` into individual scopes.
              Defaults to a single space (" ") when omitted. Ignored when `scopeClaim` resolves to
              an array claim. Has no effect unless `scopeClaim` is set.
          jwks:
            type: object
            description: JWKS configuration supporting both remote endpoints and local certificates. Either 'remote' or 'local' must be specified, but not both.
            additionalProperties: false
            oneOf:
              - required: ["remote"]
                not:
                  required: ["local"]
              - required: ["local"]
                not:
                  required: ["remote"]
            properties:
              remote:
                type: object
                description: Remote JWKS endpoint configuration. The 'uri' field is required.
                additionalProperties: false
                required: ["uri"]
                properties:
                  uri:
                    type: string
                    format: uri
                    description: JWKS endpoint URL (e.g., https://idp.example/.well-known/jwks.json).
                  certificatePath:
                    type: string
                    description: Optional path to CA certificate file for validating self-signed JWKS endpoints (e.g., /etc/certs/ca.pem).
                  skipTlsVerify:
                    type: boolean
                    default: false
                    description: If true, skip TLS certificate verification for the JWKS endpoint. Use with caution, only for testing or trusted internal endpoints.
              local:
                type: object
                description: Local certificate configuration for signature verification. Either 'inline' or 'certificatePath' must be provided, but not both.
                additionalProperties: false
                oneOf:
                  - required: ["inline"]
                    not:
                      required: ["certificatePath"]
                  - required: ["certificatePath"]
                    not:
                      required: ["inline"]
                properties:
                  inline:
                    type: string
                    description: Inline PEM-encoded certificate or public key for signature verification.
                  certificatePath:
                    type: string
                    description: Path to certificate or public key file (e.g., /etc/certs/public.pem).
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.keymanagers}"

    jwksCacheTtl:
      type: string
      description: Duration string for JWKS caching (e.g., "5m"). If omitted a default is used.
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.jwkscachettl}"

    jwksFetchTimeout:
      type: string
      description: Timeout for HTTP fetch of JWKS, e.g., "5s".
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.jwksfetchtimeout}"

    jwksFetchRetryCount:
      type: integer
      description: Number of retries for JWKS fetch on transient failures.
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.jwksfetchretrycount}"

    jwksFetchRetryInterval:
      type: string
      description: Interval between JWKS fetch retries, e.g., "2s".
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.jwksfetchretryinterval}"

    leeway:
      type: string
      description: Clock skew allowance for exp/nbf checks, e.g., "30s".
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.leeway}"

    authHeaderScheme:
      type: string
      description: Expected scheme prefix in the authorization header (e.g., "Bearer"). If set, runtime enforces the scheme; if omitted, runtime may accept raw header values or strip known schemes.
      default: Bearer
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.authheaderscheme}"

    headerName:
      type: string
      description: Header name to extract token from (default "Authorization").
      default: Authorization
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.headername}"

    onFailureStatusCode:
      type: integer
      description: HTTP status code to return on authentication failure (401 for Unauthorized, 403 for Forbidden).
      default: 401
      enum:
        - 401
        - 403
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.onfailurestatuscode}"

    errorMessageFormat:
      type: string
      description: Format of error response on JWT validation failure. Supported values are "json" (structured error), "plain" (plain text), or "minimal" (minimal response).
      default: json
      enum:
        - json
        - plain
        - minimal
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.errormessageformat}"
    
    errorMessage:
      type: string
      description: Custom error message to include in the response body on authentication failure.
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.errormessage}"

    validateIssuer:
      type: boolean
      description: Whether to validate the token's issuer claim against configured key managers.
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.validateissuer}"
    
    gatewayHost:
      type: string
      description: The host of the gateway to be included in the protected metadata URL and response.
      example: mcp1.api-platform.com
      default: localhost
      "wso2/defaultValue": "${config.policy_configurations.mcpauth_v1.gatewayhost}"


  required: ["keyManagers"]
