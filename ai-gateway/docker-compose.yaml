services:
  gateway-controller:
    # Custom build (ap gateway image build --name "$DEMO_NAME") -- adds the
    # routing policies declared in build.yaml, which the stock image doesn't
    # carry. Same image locally and on the VM; docker-compose.override.yaml
    # may still pin a different build.
    image: ghcr.io/wso2/api-platform/${DEMO_NAME:-ai-demo}-gateway-controller:${AI_GATEWAY_VERSION:-1.2.0}
    mem_limit: 60m
    mem_reservation: 60m
    cpus: 0.025
    command: ["-config", "/etc/gateway-controller/config.toml"]
    ports:
      - "${GATEWAY_CONTROLLER_REST_PORT:-9090}:9090"   # REST API
      - "${GATEWAY_CONTROLLER_ADMIN_PORT:-9094}:9092"   # Admin API
      - "${GATEWAY_CONTROLLER_METRICS_PORT:-9011}:9091"   # Metrics
    env_file:
      - path: api-platform.env
        required: true
        format: raw
      - path: ../demo.env
        required: false
        format: raw
      - path: ../secrets/idp.env
        required: false
        format: raw
      - path: ../secrets/content-safety.env
        required: false
        format: raw
    # Named explicitly, not the whole secrets/api-keys.env as an env_file:
    # that file also holds the LLM provider keys, which this container has
    # no use for. Both resolved per-call (resolve_analytics() /
    # resolve_embedding_key() in scripts/tools.sh), never stored in a file.
    # APIP_GW_ANALYTICS_ENABLED is needed here too: the controller writes
    # Envoy's access log to the runtime's analytics service only when on.
    environment:
      - APIP_GW_ANALYTICS_PUBLISHERS_MOESIF_APPLICATION_ID=${APIP_GW_ANALYTICS_PUBLISHERS_MOESIF_APPLICATION_ID:-}
      - APIP_GW_ANALYTICS_ENABLED=${APIP_GW_ANALYTICS_ENABLED:-false}
      - APIP_GW_EMBEDDING_PROVIDER_API_KEY=${APIP_GW_EMBEDDING_PROVIDER_API_KEY:-}
    volumes:
      - controller-data:/app/data
      - ./configs/config.toml:/etc/gateway-controller/config.toml:ro
      - ./resources/certificates:/app/certificates
      - ./resources/listener-certs:/app/listener-certs:ro
      - ./resources/aesgcm-keys/default-aesgcm256-v1.bin:/app/data/aesgcm-keys/default-aesgcm256-v1.bin:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gateway-network

  gateway-runtime:
    # Same custom build as gateway-controller above -- the pair must match,
    # since the policy set is compiled into both (the controller validates
    # and deploys a policy, the runtime executes it).
    image: ghcr.io/wso2/api-platform/${DEMO_NAME:-ai-demo}-gateway-runtime:${AI_GATEWAY_VERSION:-1.2.0}
    mem_limit: 180m
    mem_reservation: 180m
    cpus: 0.175
    command: ["--pol.config", "/etc/policy-engine/config.toml"]
    ports:
      # Router (Envoy)
      - "${GATEWAY_HTTP_PORT:-8080}:8080"   # HTTP ingress
      - "${GATEWAY_HTTPS_PORT:-8443}:8443"   # HTTPS ingress
      - "${GATEWAY_XDS_PORT:-8081}:8081"   # xDS-managed API listener
      - "${GATEWAY_ENVOY_ADMIN_PORT:-9901}:9901"   # Envoy admin
      # Policy Engine
      - "${GATEWAY_POLICY_ADMIN_PORT:-9002}:9002"   # Admin API
      - "${GATEWAY_METRICS_PORT:-9003}:9003"   # Metrics
    env_file:
      - path: api-platform.env
        required: true
        format: raw
      - path: ../demo.env
        required: false
        format: raw
      - path: ../secrets/idp.env
        required: false
        format: raw
      - path: ../secrets/content-safety.env
        required: false
        format: raw
    # Same reasoning as gateway-controller above. APIP_GW_ANALYTICS_ENABLED
    # also drives config.toml's templated [analytics] enabled, and
    # APIP_GW_EMBEDDING_PROVIDER_API_KEY its embedding_provider_api_key
    # (semantic-cache, semantic-model-routing) -- this is the service that
    # actually enforces/runs both on real traffic.
    environment:
      - GATEWAY_CONTROLLER_HOST=gateway-controller
      - APIP_GW_ANALYTICS_PUBLISHERS_MOESIF_APPLICATION_ID=${APIP_GW_ANALYTICS_PUBLISHERS_MOESIF_APPLICATION_ID:-}
      - APIP_GW_ANALYTICS_ENABLED=${APIP_GW_ANALYTICS_ENABLED:-false}
      - APIP_GW_EMBEDDING_PROVIDER_API_KEY=${APIP_GW_EMBEDDING_PROVIDER_API_KEY:-}
    volumes:
      - ./configs/config.toml:/etc/policy-engine/config.toml:ro
      - ./configs/llm-pricing/model_prices.json:/etc/policy-engine/llm-pricing/model_prices.json:ro
    networks:
      - gateway-network

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"     # Jaeger UI
      - "14268:14268"     # Jaeger collector HTTP
    networks:
      - gateway-network
    profiles: ["tracing"]

  # Traces to Jaeger. Answers as otel-collector, where config.toml's
  # [tracing] sends them -- as otel-collector-moesif does in moesif mode.
  otel-collector-local:
    image: otel/opentelemetry-collector:0.112.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    networks:
      gateway-network:
        aliases: [otel-collector]
    depends_on:
      - jaeger
    profiles: ["tracing"]

  opensearch:
    image: opensearchproject/opensearch:3.4.0
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - gateway-network
    profiles: ["logging"]

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.4.0
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    networks:
      - gateway-network
    depends_on:
      - opensearch
    profiles: ["logging"]

  fluent-bit:
    image: fluent/fluent-bit:4.2.1
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./observability/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./observability/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf
      - ./observability/fluent-bit/add_component.lua:/fluent-bit/scripts/add_component.lua
    command: /fluent-bit/bin/fluent-bit -c /fluent-bit/etc/fluent-bit.conf
    networks:
      - gateway-network
    depends_on:
      - opensearch
    profiles: ["logging"]

  prometheus:
    image: prom/prometheus:v3.3.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9092:9090"   # Prometheus UI (9092 to avoid conflict with gateway-controller)
    networks:
      - gateway-network
    profiles: ["metrics"]

  grafana:
    image: "grafana/grafana:latest"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/infrastructure-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"   # Grafana UI
    networks:
      - gateway-network
    depends_on:
      - prometheus
    profiles: ["metrics"]

volumes:
  controller-data:
    driver: local
  opensearch-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  gateway-network:
    driver: bridge
