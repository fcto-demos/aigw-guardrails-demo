# AI Gateway configuration — WSO2 AI Platform demo
# Copy to: /opt/wso2/wso2apip-ai-gateway-1.2.0/configs/config.toml
#
# Changes from the shipped file are marked  # CHANGED.

# Analytics publishing to Moesif. The application ID comes from
# secrets/api-keys.env locally, or api-platform.env on the VM -- never
# write it as a literal here.
#
# enabled follows APIP_GW_ANALYTICS_ENABLED (one config.toml, no separate
# local variant): local dev's run-local.sh sets it from demo.env's
# ANALYTICS_MODE; on the VM, set it by hand alongside a real application_id.
# Default is "false" because enabled=true with a blank id fails config
# validation and the container won't start.
# CHANGED: Semantic cache policy defaults — embedding provider + vector DB.
# API key comes from api-platform.env (APIP_GW_EMBEDDING_PROVIDER_API_KEY).
embedding_provider = "MISTRAL"
embedding_provider_endpoint = "https://api.mistral.ai/v1/embeddings"
embedding_provider_model = "mistral-embed"
embedding_provider_dimension = 1024
embedding_provider_api_key = '{{ env "APIP_GW_EMBEDDING_PROVIDER_API_KEY" "" }}'

vector_db_provider = "REDIS"
vector_db_provider_host = "redis"
vector_db_provider_port = 6379
vector_db_provider_database = "0"
vector_db_provider_username = "default"
vector_db_provider_password = "default"
vector_db_provider_ttl = 3600

# Content safety cards, set in secrets/content-safety.env. A provider left
# blank is not provisioned. Azure Content Safety:
azurecontentsafety_endpoint = '{{ env "AZURE_CONTENT_SAFETY_ENDPOINT" "" }}'
azurecontentsafety_key = '{{ env "AZURE_CONTENT_SAFETY_KEY" "" }}'
# AWS Bedrock Guardrails. The credentials are not set here: the AWS SDK reads
# them from the same file (a Bedrock API key, or an access key pair).
awsbedrock_guardrail_region = '{{ env "AWS_BEDROCK_REGION" "" }}'
awsbedrock_guardrail_id = '{{ env "AWS_BEDROCK_GUARDRAIL_ID" "" }}'
awsbedrock_guardrail_version = '{{ env "AWS_BEDROCK_GUARDRAIL_VERSION" "" }}'

[analytics]
enabled = '{{ env "APIP_GW_ANALYTICS_ENABLED" "false" }}'
enabled_publishers = ["moesif"]

[analytics.publishers.moesif]
application_id = '{{ env "APIP_GW_ANALYTICS_PUBLISHERS_MOESIF_APPLICATION_ID" "" }}'

[router]
# Accepts any Host header. Left as shipped: the gateway shares its hostname
# with the control plane and is distinguished by port (8443), so there is
# nothing to disambiguate here.
gateway_host = "*"

[router.access_logs]
enabled = true

# The downstream listener certificate is NOT configured here. It defaults to
# ./listener-certs/default-listener.{crt,key}, which deploy-certs-remote.sh overwrites
# with the Let's Encrypt pair. Leaving the table out keeps those defaults.

[controller.server]
gateway_id = '{{ env "APIP_GW_CONTROLLER_SERVER_GATEWAY_ID" "platform-gateway-id" }}'

[controller.storage]
# SQLite, persisted in the controller-data volume. Survives restarts,
# --force-recreate, image swaps and `down`; only `down -v` destroys it.
type = '{{ env "APIP_GW_CONTROLLER_STORAGE_TYPE" "sqlite" }}'

[controller.storage.sqlite]
path = '{{ env "APIP_GW_CONTROLLER_STORAGE_SQLITE_PATH" "./data/gateway.db" }}'

[policy_engine.logging]
level = "info"

[controller.logging]
level = '{{ env "APIP_GW_CONTROLLER_LOGGING_LEVEL" "info" }}'

[controller.controlplane]
# host and token come from api-platform.env — the token is single-use and must
# not be written into a file that lands in source control.
host = '{{ env "APIP_GW_CONTROLLER_CONTROLPLANE_HOST" "" }}'
token = '{{ env "APIP_GW_CONTROLLER_CONTROLPLANE_TOKEN" "" }}'

# CHANGED: ships as "true". This channel carries the registration token and
# every configuration update, and the Platform API presents a publicly-trusted
# certificate at the public hostname (DEMO_HOSTNAME), so verification works. The extra_hosts
# entry in docker-compose.override.yaml keeps the connection on the box without
# breaking hostname verification.
insecure_skip_verify = '{{ env "APIP_GW_CONTROLLER_CONTROLPLANE_INSECURE_SKIP_VERIFY" "false" }}'

gateway_name = '{{ env "APIP_GW_CONTROLLER_CONTROLPLANE_GATEWAY_NAME" "default" }}'
apim_oauth2_client_id = '{{ env "APIP_GW_CONTROLLER_CONTROLPLANE_APIM_OAUTH2_CLIENT_ID" "" }}'
apim_oauth2_client_secret = '{{ env "APIP_GW_CONTROLLER_CONTROLPLANE_APIM_OAUTH2_CLIENT_SECRET" "" }}'

[controller.policies]
definitions_path = '{{ env "APIP_GW_CONTROLLER_POLICIES_DEFINITIONS_PATH" "./default-policies" }}'

[controller.auth.basic]
enabled = true

[[controller.auth.basic.users]]
username        = '{{ env "APIP_GW_CONTROLLER_AUTH_BASIC_ADMIN_USERNAME" "" }}'
password        = '{{ env "APIP_GW_CONTROLLER_AUTH_BASIC_ADMIN_PASSWORD_HASH" "" }}'
password_hashed = true
roles           = ["admin"]

[policy_configurations.jwtauth_v1]
jwkscachettl = "5m"
jwksfetchtimeout = "5s"
jwksfetchretrycount = 3
jwksfetchretryinterval = "2s"
leeway = "30s"
authheaderscheme = "Bearer"
headername = "Authorization"
onfailurestatuscode = 401
errormessageformat = "json"
errormessage = "Authentication failed"
validateissuer = true

# The MCP auth cards' identity provider, set in secrets/idp.env (IDP_*), which
# both gateway containers load as an env_file. skipTlsVerify cannot come from
# there (templates only fill strings, and this must be a boolean): true
# accepts a self-signed IdP; set false for a publicly trusted one.
[[policy_configurations.jwtauth_v1.keymanagers]]
name   = "mcp-idp"
issuer = '{{ env "IDP_ISSUER" "" }}'

[policy_configurations.jwtauth_v1.keymanagers.jwks.remote]
uri = '{{ env "IDP_JWKS_URI" "" }}'
skipTlsVerify = true

[policy_configurations.mcpauth_v1]
# Host published in the protected-resource metadata URL that mcp-auth serves at
# <context>/.well-known/oauth-protected-resource: DEMO_HOSTNAME, localhost
# when blank. HOST ONLY — mcp-auth appends the request's port itself, so
# including :8443 here yields a doubled ":8443:8443".
gatewayhost = '{{ env "DEMO_HOSTNAME" "localhost" }}'
# No key managers here: mcp-auth (and the mcp-auth-passthrough /
# gateway-mcp-auth forks) read jwt-auth's list above.

[router.upstream.timeouts]
route_timeout_ms = 300000
route_idle_timeout_ms = 300000
connect_timeout_ms = 10000

[router.http_listener]
per_connection_buffer_limit_bytes = 52428800  # 50 MiB

# =============================================================================
# TRACING — OTLP export to the OpenTelemetry Collector
# =============================================================================
# Sent to otel-collector: otel-collector-local + jaeger (profile tracing), or
# otel-collector-moesif (profile moesif), per ANALYTICS_MODE.
# If this is enabled while the collector is down, every export logs a warning.
#
# Jaeger stores traces IN MEMORY — restarting it loses all trace history.
#
# sampling_rate 1.0 captures every request, which is right at PoC traffic
# levels. Lower it (0.1 = 10%) if volume becomes an issue.

[tracing]
enabled               = true
endpoint              = "otel-collector:4317"
service_version       = "0.2.0"
batch_timeout         = "1s"
max_export_batch_size = 512
sampling_rate         = 1.0

# CHANGED 2026-09-09: semantic-model-routing v0.9.0 embedding settings.
#
# NOT a duplicate of the top-level embedding_* keys near the head of this file.
# Those are read by semantic-cache. This policy resolves a CEL path into this
# section instead, so the top-level keys do nothing for it. Two namespaces,
# near-identical key names.
#
# The section is named _v1 even though the policy is v0.9.0 -- that is what the
# shipped policy definition asks for. There is no dimension key: the routing
# schema has no dimension parameter at all.
#
# Reuses the Mistral credential already set for semantic-cache
# (APIP_GW_EMBEDDING_PROVIDER_API_KEY in api-platform.env).

[policy_configurations.semantic_model_routing_v1]
embedding_provider          = "MISTRAL"
embedding_provider_endpoint = "https://api.mistral.ai/v1/embeddings"
embedding_provider_model    = "mistral-embed"
embedding_provider_api_key  = "{{ env \"APIP_GW_EMBEDDING_PROVIDER_API_KEY\" \"\" }}"

# intelligent-model-routing's classifier: an LLM that reads each question and
# picks a routing rule. Mistral's chat API is OpenAI-compatible, hence
# llm_provider "OPENAI". Same Mistral key as the embeddings above, and a
# model the free tier serves (mistral-small-latest is rate-limited there).
[policy_configurations.intelligent_model_routing_v1]
llm_provider          = "OPENAI"
llm_provider_endpoint = "https://api.mistral.ai/v1/chat/completions"
llm_provider_model    = "ministral-14b-latest"
llm_provider_api_key  = "{{ env \"APIP_GW_EMBEDDING_PROVIDER_API_KEY\" \"\" }}"

# How the budgets and rate limits count (spend limit, cost-based routing, token
# quota, MCP rate limit): RATE_LIMIT_ALGORITHM in demo.env, which lists the
# possible values. Without it, fixed-window, the gateway's own default for
# most of these policies. The counters stay in each gateway's memory.
[policy_configurations.ratelimit_v1]
algorithm = '{{ env "RATE_LIMIT_ALGORITHM" "fixed-window" }}'

# TypeSafe AI's Jev, for the Jev cards. The key is set in
# secrets/content-safety.env; left blank, those cards are not provisioned.
[policy_configurations.typesafe_jev_v0]
api_key  = "{{ env \"TYPESAFE_API_KEY\" \"\" }}"
base_url = "https://api.typesafe.ai"
model    = "jev-latest"
